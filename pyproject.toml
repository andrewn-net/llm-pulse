[project]
name = "llmpulse"
version = "0.1.0"
description = "Take the pulse of the LLM landscape — pick a model, see what changed."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "platformdirs>=4.2",
    "questionary>=2.0",
]

[project.scripts]
llmpulse = "pulse.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse"]
